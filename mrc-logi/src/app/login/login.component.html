<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        <form>

            <label>Username</label>
            <input type="text" name="username" [(ngModel)]="username" placeholder="Enter Username">

            <label>Password</label>
            <input type="password" name="password" [(ngModel)]="password" placeholder="Enter Password">

            <button type="submit" (click)="login(); changeCount()">Login ({{ccount}})</button>
            <p *ngIf="isLoggedIn" style="color: green;">Login Successful!</p>
            <a href="#">Forgot Password?</a>

        </form>
    </div>

</body>

</html>
