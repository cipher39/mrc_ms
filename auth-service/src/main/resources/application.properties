spring.application.name=auth-service

#Change these settings according to database you are using
#mysql> SHOW GLOBAL VARIABLES LIKE 'PORT';
spring.datasource.url=jdbc:mysql://localhost:3306/mrc_db
spring.datasource.username=root
#If MySQL installation is password proctored,then use below property to set password
spring.datasource.password=mysql@root

#JPA settings
# It Will show all the SQL Statements that was executed by the JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update

#s
jwt.secret=MyVerySecretKeyForMRCApplication1234567890
jwt.expiration=3600000

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.cors=TRACE
